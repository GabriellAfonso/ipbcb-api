services:
  ipbcb_server:
    container_name: ipbcb-server-prod
    build:
      context: .
    image: ipbcb-server:prod
    command:
    - sh
    - -c
    - |
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.asgi:application \
        -k uvicorn.workers.UvicornWorker \
        --bind 0.0.0.0:8000 \
        --workers 4 \
        --timeout 60 \
        --access-logfile - \
        --error-logfile - \
        --capture-output
    env_file:
      - ./.env
    # Declared here, not in .env: `environment` wins over `env_file`, so a stale
    # DJANGO_SETTINGS_MODULE in .env can no longer boot production on dev settings.
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ./server/static/:/server/static/
      - ./server/media:/server/media/
    depends_on:
      ipbcb_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

  ipbcb_db:
    container_name: ipbcb-db-prod
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - ipbcb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - proxy-network

  # Every refresh writes a blacklist row (BLACKLIST_AFTER_ROTATION), so the table grows
  # without bound. This drops the rows whose tokens have already expired — housekeeping,
  # not security: an expired token is refused on its own expiry. The same daily loop deletes
  # Sunday setlists past their use (specs/017-sunday-setlist-push FR-028); a failure in one
  # command does not skip the other.
  ipbcb_token_flush:
    container_name: ipbcb-token-flush-prod
    image: ipbcb-server:prod
    command:
    - sh
    - -c
    - |
      while true; do
        python manage.py flushexpiredtokens
        python manage.py purge_expired_setlists
        sleep 86400
      done
    env_file:
      - ./.env
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      ipbcb_db:
        condition: service_healthy
      ipbcb_server:
        condition: service_started
    restart: unless-stopped
    networks:
      - proxy-network

  # Sunday-night reminder to register the played songs (specs/017-sunday-setlist-push). Each
  # run does nothing outside Sunday 21:00-24:00; inside, it claims the current half-hour window
  # on the setlist before pushing, so restarts and overlaps never send a window twice. A loop
  # plus a management command, like the token flush above, instead of a task queue. Reads
  # FCM_SERVICE_ACCOUNT_JSON_BASE64 from ./.env, the only extra secret it needs.
  ipbcb_setlist_reminder:
    container_name: ipbcb-setlist-reminder-prod
    image: ipbcb-server:prod
    command:
    - sh
    - -c
    - |
      while true; do
        python manage.py send_setlist_reminders
        sleep 60
      done
    env_file:
      - ./.env
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      ipbcb_db:
        condition: service_healthy
      ipbcb_server:
        condition: service_started
    restart: unless-stopped
    networks:
      - proxy-network

  prometheus:
    container_name: ipbcb-prometheus-prod
    image: prom/prometheus:v3.4.2
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ipbcb_prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - proxy-network

  grafana:
    container_name: ipbcb-grafana-prod
    image: grafana/grafana:11.6.0
    # Its own file, not ./.env: Grafana has a login form open to the internet and needs
    # none of the application secrets. Sharing ./.env put DJANGO_SECRET_KEY and
    # POSTGRES_PASSWORD one `printenv` away from whoever got into this container.
    env_file:
      - ./.env.grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ipbcb_grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - proxy-network

volumes:
  ipbcb_postgres_data:
  ipbcb_prometheus_data:
  ipbcb_grafana_data:

networks:
  proxy-network:
    external: true